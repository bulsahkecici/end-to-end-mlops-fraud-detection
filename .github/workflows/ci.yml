name: CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src tests

      - name: Black --check
        run: black --check src tests

      - name: Mypy
        run: mypy src

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

      - name: Full suite with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose config

      - name: Build API image
        run: docker build -f Dockerfile.api -t ieee-fraud-api:ci .

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Train, promote, and hit the live API on synthetic data
        run: python scripts/validate_e2e.py
        env:
          MLFLOW_TRACKING_URI: "sqlite:///${{ github.workspace }}/e2e_mlflow.db"
