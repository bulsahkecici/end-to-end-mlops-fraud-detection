name: CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_production_like:
        description: "Run the MinIO-dependent production-like lifecycle (currently upstream-blocked)"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src tests

      - name: Black --check
        run: black --check src tests

      - name: Mypy
        run: mypy src

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

      - name: Full suite with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: lint-type-test
    env:
      # Dummy values so `docker compose config` can parse the
      # production-like profile's required vars — never real secrets.
      POSTGRES_PASSWORD: ci-only-placeholder
      MINIO_ROOT_USER: ci-only-placeholder
      MINIO_ROOT_PASSWORD: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate docker compose config (both profiles)
        run: |
          docker compose --profile local-lite config
          docker compose --profile production-like config

      - name: Build API image
        run: docker build -f Dockerfile.api -t ieee-fraud-api:ci .

      - name: Production-like deploy, serve, and rollback smoke (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production_like }}
        run: python scripts/validate_production_e2e.py

      - name: Report production-like MinIO blocker
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_production_like != true }}
        run: |
          echo "::notice title=Production-like E2E not run::The retained Community MinIO container distribution is obsolete/unavailable. This required CI run does not claim the production-like lifecycle passed; use workflow_dispatch with run_production_like=true only after an S3-compatible object-store decision."

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Train, promote, and hit the live API on synthetic data
        run: python scripts/validate_e2e.py
        env:
          MLFLOW_TRACKING_URI: "sqlite:///${{ github.workspace }}/e2e_mlflow.db"
